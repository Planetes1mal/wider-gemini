name: Release

# Push v<version_name> for an RC (e.g. v2.6.0-rc.1), or v<version> for a stable release.
# The shared packager validates the tag, manifest, and exact CHANGELOG heading before packaging.
# RC assets are for manual testing; upload only stable release assets to Chrome Web Store.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6

      - name: Validate release and build extension ZIP
        id: package
        shell: pwsh
        run: |
          $package = & ./scripts/package.ps1 -Tag $env:GITHUB_REF_NAME -ReleaseNotesPath release_body.md
          "version=$($package.Version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($package.Prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Wider Gemini ${{ github.ref_name }}
          body_path: release_body.md
          files: wider-gemini-${{ steps.package.outputs.version }}.zip
          fail_on_unmatched_files: true
          prerelease: ${{ steps.package.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.package.outputs.prerelease == 'true' && 'false' || 'legacy' }}
