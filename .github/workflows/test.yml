name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run unit and packaging tests
        run: node scripts/test.js

      - name: Run synthetic layout regression
        shell: pwsh
        run: |
          $chromePath = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe').'(default)'
          $chromeVersion = (Get-Item -LiteralPath $chromePath).VersionInfo.ProductVersion
          Write-Host "Google Chrome $chromeVersion ($chromePath)"
          $env:WG_CHROME = $chromePath
          node tests/e2e/message-width.js
