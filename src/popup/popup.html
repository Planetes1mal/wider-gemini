<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wider Gemini</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-icon" aria-hidden="true">WG</div>
            <h1 id="i18n-appName">Wider Gemini</h1>
            <p class="header-subtitle" id="i18n-headerSubtitle">让对话界面更宽更舒适</p>
        </header>

        <fieldset id="settingsControls" disabled>
            <legend class="visually-hidden" id="i18n-settingsSite">Website settings</legend>
            <div class="site-tabs" role="group" aria-labelledby="i18n-settingsSite">
                <button type="button" id="siteGeminiBtn" class="site-btn site-active" data-site="gemini" aria-pressed="true">
                    Gemini <span class="site-current" hidden>Current</span>
                </button>
                <button type="button" id="siteChatgptBtn" class="site-btn" data-site="chatgpt" aria-pressed="false">
                    ChatGPT <span class="site-current" hidden>Current</span>
                </button>
            </div>
            <div class="site-power" id="sitePower">
                <span class="site-power-dot" aria-hidden="true"></span>
                <label for="siteEnabledToggle" class="site-power-label" id="siteEnabledLabel">Enable on Gemini</label>
                <span class="site-power-state" id="sitePowerState" hidden></span>
                <label class="switch">
                    <input type="checkbox" id="siteEnabledToggle" role="switch" disabled>
                    <span class="slider-toggle" aria-hidden="true"></span>
                </label>
            </div>
            <p id="siteStatus" class="site-status" role="status" aria-live="polite" hidden></p>

            <section class="card width-card">
                <div class="card-header width-heading">
                    <label for="widthSlider" class="card-title" id="i18n-widthLabel">对话区域宽度</label>
                    <div class="unit-segment" role="group" aria-label="Width unit">
                        <button type="button" id="unitPxBtn" class="segment-btn segment-active" data-unit="px" aria-pressed="true">px</button>
                        <button type="button" id="unitPercentBtn" class="segment-btn" data-unit="percent" aria-pressed="false">%</button>
                    </div>
                    <label class="switch width-switch">
                        <span class="visually-hidden" id="i18n-widthEnabled">Enable widening</span>
                        <input type="checkbox" id="widthEnabledToggle" aria-labelledby="i18n-widthEnabled" checked>
                        <span class="slider-toggle" aria-hidden="true"></span>
                    </label>
                </div>
                <fieldset id="widthControls" aria-labelledby="i18n-widthLabel">
                    <div class="slider-value width-display">
                        <span id="widthValue">1000</span>
                        <span id="widthUnitLabel" class="unit">px</span>
                    </div>
                    <div class="slider-wrapper">
                        <div class="slider-container">
                            <input type="range" id="widthSlider" min="700" max="2000" step="50" value="1000">
                            <div class="slider-track"></div>
                        </div>
                    </div>
                    <div class="preset-buttons" id="presetButtonsContainer"></div>
                    <details id="widthOptions" class="width-options">
                        <summary><span id="i18n-widthOptions">Range &amp; presets</span></summary>
                        <div class="width-options-body">
                            <div class="range-inputs">
                                <label class="range-label"><span id="i18n-widthMin">最小宽度</span>
                                    <input type="number" id="widthMinInput" min="300" max="5000" step="50" value="700">
                                </label>
                                <label class="range-label"><span id="i18n-widthMax">最大宽度</span>
                                    <input type="number" id="widthMaxInput" min="300" max="5000" step="50" value="2000">
                                </label>
                            </div>
                            <div class="preset-toolbar">
                                <button type="button" id="editPresetsBtn" class="secondary-btn"><span
                                        id="i18n-editPresets">编辑预设</span></button>
                                <button type="button" id="donePresetsBtn" class="secondary-btn" style="display:none;"><span
                                        id="i18n-donePresets">完成</span></button>
                            </div>
                            <section class="manage-card">
                                <button type="button" class="collapse-header" id="managePresetsToggle" aria-expanded="false">
                                    <span class="card-icon" aria-hidden="true">P</span>
                                    <span class="card-title" id="i18n-managePresets">管理预设</span>
                                    <span class="collapse-summary" id="managePresetsSummary"></span>
                                </button>
                                <div class="collapse-body" id="managePresetsBody" hidden>
                                    <div id="managePresetsRows"></div>
                                </div>
                            </section>
                        </div>
                    </details>
                </fieldset>
            </section>

            <details id="readingSettings" class="card reading-settings">
                <summary><span id="i18n-readingSettings">Reading &amp; typography</span></summary>
                <div class="reading-body">
                    <section class="card task-card" aria-labelledby="i18n-taskPresets">
                        <div class="card-header">
                            <span class="card-icon" aria-hidden="true">T</span>
                            <label for="taskPresetSelect" class="card-title" id="i18n-taskPresets">Task presets</label>
                        </div>
                        <select id="taskPresetSelect" class="language-select" aria-describedby="taskPresetPreview" disabled></select>
                        <p id="taskPresetPreview" class="task-preview"></p>
                        <div class="task-actions">
                            <button type="button" id="applyTaskPreset" class="secondary-btn task-apply" disabled><span id="i18n-taskApply">Apply</span></button>
                            <button type="button" id="restoreTaskPreset" class="secondary-btn" disabled><span id="i18n-taskRestore">Restore previous settings</span></button>
                        </div>
                        <p id="taskPresetStatus" class="task-status" role="status" aria-live="polite"></p>
                    </section>

                    <section class="card density-card">
                        <div class="card-header">
                            <span class="card-icon" aria-hidden="true">¶</span>
                            <label for="compactnessSlider" class="card-title" id="i18n-densityLabel">阅读密度</label>
                        </div>
                        <div class="slider-wrapper">
                            <div class="slider-container">
                                <input type="range" id="compactnessSlider" min="0" max="100" step="1" value="0">
                                <div class="slider-track"></div>
                            </div>
                            <div class="slider-value">
                                <span id="compactnessValue">0</span>
                                <span class="unit" id="i18n-compactnessUnit">%</span>
                            </div>
                        </div>
                        <button type="button" class="collapse-header advanced-toggle" id="advancedDensityToggle" aria-expanded="false">
                            <span class="card-title" id="i18n-advancedDensity">高级间距</span>
                            <span class="collapse-summary" id="densitySummary"></span>
                        </button>
                        <div class="collapse-body" id="advancedDensityBody" hidden>
                            <p class="task-hint" id="i18n-autoSpacingHint">Auto follows each message's native spacing. Moving either slider applies both values below manually.</p>
                            <label class="range-label density-row"><span id="i18n-lineHeightLabel">行高</span>
                                <input type="range" id="lineHeightSlider" min="1.15" max="1.8" step="0.01" value="1.42">
                                <span id="lineHeightValue">1.42</span>
                            </label>
                            <label class="range-label density-row"><span id="i18n-paragraphSpacingLabel">段落间距</span>
                                <input type="range" id="paragraphSpacingSlider" min="0" max="24" step="1" value="12">
                                <span><span id="paragraphSpacingValue">12</span> px</span>
                            </label>
                            <button type="button" id="resetDensityBtn" class="secondary-btn"><span id="i18n-resetDensity">重置间距</span></button>
                        </div>
                    </section>

                    <section class="card font-size-card">
                        <div class="card-header">
                            <span class="card-icon" aria-hidden="true">A</span>
                            <label for="fontSizeSlider" class="card-title" id="i18n-fontSizeLabel">字号</label>
                        </div>
                        <div class="slider-wrapper">
                            <div class="slider-container">
                                <input type="range" id="fontSizeSlider" min="75" max="200" step="5" value="100">
                                <div class="slider-track"></div>
                            </div>
                            <div class="slider-value">
                                <span id="fontSizeValue">100</span>
                                <span class="unit">%</span>
                            </div>
                        </div>
                        <button type="button" id="resetFontSizeBtn" class="secondary-btn"><span id="i18n-resetFontSize">重置字号</span></button>
                    </section>

                    <section class="card code-card" id="codeWrapCard">
                        <div class="card-header">
                            <span class="card-icon" aria-hidden="true">C</span>
                            <label for="codeWrapToggle" class="card-title" id="i18n-codeWrapLabel">代码区域自动换行</label>
                        </div>
                        <div class="toggle-wrapper">
                            <div class="toggle-container">
                                <label class="switch">
                                    <input type="checkbox" id="codeWrapToggle">
                                    <span class="slider-toggle"></span>
                                </label>
                                <span id="codeWrapStatus" class="status-text">关闭</span>
                            </div>
                        </div>
                    </section>

                    <section class="card user-width-card">
                        <div class="card-header">
                            <span class="card-icon" aria-hidden="true">U</span>
                            <label for="userFullWidthToggle" class="card-title" id="i18n-userFullWidthLabel">用户消息铺满宽度</label>
                        </div>
                        <div class="toggle-wrapper">
                            <div class="toggle-container">
                                <label class="switch">
                                    <input type="checkbox" id="userFullWidthToggle">
                                    <span class="slider-toggle"></span>
                                </label>
                                <span id="userFullWidthStatus" class="status-text">关闭</span>
                            </div>
                        </div>
                    </section>

                </div>
            </details>

            <section class="card language-card">
                <div class="card-header">
                    <label for="uiLanguageSelect" class="card-title" id="i18n-uiLanguageLabel">界面语言</label>
                </div>
                <select id="uiLanguageSelect" class="language-select">
                    <option value="auto" id="i18n-uiLanguageAuto">跟随浏览器</option>
                    <option value="en">English</option>
                    <option value="zh_CN">简体中文</option>
                    <option value="zh_TW">繁體中文</option>
                    <option value="ko">한국어</option>
                    <option value="ja">日本語</option>
                    <option value="es">Español</option>
                </select>
            </section>

        </fieldset>

        <footer class="support-links">
            <a href="../help/help.html" target="_blank" rel="noopener" id="i18n-helpLink">Help &amp; feedback</a>
            <a href="https://github.com/Planetes1mal/wider-gemini" target="_blank" rel="noopener noreferrer" id="i18n-sourceLink">GitHub · Source</a>
        </footer>

        <div id="refreshNotice" class="refresh-notice">
            <span class="refresh-spinner" aria-hidden="true"></span>
            <span class="refresh-text" id="i18n-refreshing">正在刷新页面...</span>
        </div>
    </div>
    <script src="../shared/settings-utils.js"></script>
    <script src="popup.js"></script>
</body>

</html>
