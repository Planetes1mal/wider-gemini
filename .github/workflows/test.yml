name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run unit and packaging tests
        run: node scripts/test.js

      - name: Set up Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Run synthetic layout regression
        env:
          WG_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/e2e/message-width.js
